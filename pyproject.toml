[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kizcaption"
version = "1.0.11"
description = "Offline multilingual live caption companion for OBS by kenewjr 2026"
readme = "README.md"
authors = [{name = "kenewjr"}]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
kizcaption = "lumacaption.main:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lumacaption = ["assets/*", "output/*.html"]
