name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  build-and-release:
    name: Build and Release KizCaption Standalone .EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run Test Suite before Build
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v

      - name: Prepare Assets for Bundler
        shell: powershell
        run: |
          if (-not (Test-Path "models")) { New-Item -ItemType Directory -Path "models" -Force }
          if (-not (Test-Path "output")) { New-Item -ItemType Directory -Path "output" -Force }
          Copy-Item -Force "src/lumacaption/assets/silero_vad.onnx" "models/silero_vad.onnx"
          Copy-Item -Force "src/lumacaption/output/overlay.html" "output/overlay.html"
          if (-not (Test-Path "vocabulary.json")) {
              Copy-Item -Force "src/lumacaption/assets/vocabulary.json" "vocabulary.json"
          }
          if (-not (Test-Path "config.json")) {
              Copy-Item -Force "config.example.json" "config.json"
          }

      - name: Build Standalone .EXE
        run: |
          pyinstaller KizCaption.spec --noconfirm


      - name: Copy user template assets to dist
        shell: powershell
        run: |
          if (-not (Test-Path "dist/KizCaption/output")) { New-Item -ItemType Directory -Path "dist/KizCaption/output" -Force }
          if (-not (Test-Path "dist/KizCaption/models")) { New-Item -ItemType Directory -Path "dist/KizCaption/models" -Force }
          Copy-Item -Force "output/overlay.html" "dist/KizCaption/output/"
          Copy-Item -Force "models/silero_vad.onnx" "dist/KizCaption/models/"
          Copy-Item -Force "config.example.json" "dist/KizCaption/"
          if (Test-Path "vocabulary.json") {
              Copy-Item -Force "vocabulary.json" "dist/KizCaption/"
          } else {
              Copy-Item -Force "src/lumacaption/assets/vocabulary.json" "dist/KizCaption/vocabulary.json"
          }

      - name: Archive Release Package
        shell: powershell
        run: |
          Compress-Archive -Path dist/KizCaption/* -DestinationPath KizCaption-windows-x64.zip -Force

      - name: Determine Release Tag
        id: release_info
        shell: powershell
        run: |
          $tag = "${{ inputs.tag_name }}"
          if (-not $tag -or $tag.Trim() -eq "") {
              if ("${{ github.ref }}".StartsWith("refs/tags/")) {
                  $tag = "${{ github.ref_name }}"
              } else {
                  $tag = "v1.0.0"
              }
          }
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: KizCaption-windows-x64.zip
          name: "KizCaption ${{ steps.release_info.outputs.tag }}"
          generate_release_notes: true
          draft: false
