name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version name (e.g. v1.0.8)'
        required: false
        default: 'v1.0.8'

permissions:
  contents: write

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: "cpu"
            name: "KizCaption (CPU Edition)"
            package_name: "KizCaption-windows-x64-cpu"
            install_gpu: false
          - flavor: "cuda"
            name: "KizCaption (NVIDIA CUDA Edition)"
            package_name: "KizCaption-windows-x64-cuda"
            install_gpu: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies & PyInstaller
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if ("${{ matrix.install_gpu }}" -eq "true") {
              Write-Host "Installing NVIDIA CUDA acceleration packages..."
              python -m pip install -r requirements-gpu.txt
          } else {
              Write-Host "Skipping GPU packages for CPU-only build..."
          }
          python -m pip install pyinstaller

      - name: Run Test Suite before Build
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v

      - name: Prepare Assets for Bundler
        shell: powershell
        run: |
          if (-not (Test-Path "models")) { New-Item -ItemType Directory -Path "models" -Force }
          if (-not (Test-Path "output")) { New-Item -ItemType Directory -Path "output" -Force }
          Copy-Item -Force "src/lumacaption/assets/silero_vad.onnx" "models/silero_vad.onnx"
          Copy-Item -Force "src/lumacaption/output/overlay.html" "output/overlay.html"
          if (-not (Test-Path "vocabulary.json")) {
              Copy-Item -Force "src/lumacaption/assets/vocabulary.json" "vocabulary.json"
          }
          if (-not (Test-Path "config.json")) {
              Copy-Item -Force "config.example.json" "config.json"
          }

      - name: Build Standalone .EXE
        run: |
          pyinstaller KizCaption.spec --noconfirm

      - name: Copy user template assets to dist
        shell: powershell
        run: |
          if (-not (Test-Path "dist/KizCaption/output")) { New-Item -ItemType Directory -Path "dist/KizCaption/output" -Force }
          if (-not (Test-Path "dist/KizCaption/models")) { New-Item -ItemType Directory -Path "dist/KizCaption/models" -Force }
          Copy-Item -Force "output/overlay.html" "dist/KizCaption/output/"
          Copy-Item -Force "models/silero_vad.onnx" "dist/KizCaption/models/"
          Copy-Item -Force "config.example.json" "dist/KizCaption/"
          if (Test-Path "vocabulary.json") {
              Copy-Item -Force "vocabulary.json" "dist/KizCaption/"
          } else {
              Copy-Item -Force "src/lumacaption/assets/vocabulary.json" "dist/KizCaption/vocabulary.json"
          }

          if ("${{ matrix.install_gpu }}" -eq "true") {
              # Double failsafe: ensure CUDA 12 DLLs are placed directly in dist root for instant out-of-the-box GPU detection
              $cublas = Get-ChildItem -Path "dist/KizCaption" -Recurse -Filter "cublas64_12.dll" | Select-Object -First 1
              if ($cublas) {
                  Write-Host "CUDA DLL verified: $($cublas.FullName)"
                  Copy-Item -Force $cublas.FullName "dist/KizCaption/"
                  $cublasLt = Get-ChildItem -Path "dist/KizCaption" -Recurse -Filter "cublasLt64_12.dll" | Select-Object -First 1
                  if ($cublasLt) { Copy-Item -Force $cublasLt.FullName "dist/KizCaption/" }
              } else {
                  Write-Error "ERROR: cublas64_12.dll was not bundled into dist/KizCaption! Check requirements-gpu.txt installation."
                  exit 1
              }
          }

      - name: Archive Release Package
        shell: powershell
        run: |
          Compress-Archive -Path dist/KizCaption/* -DestinationPath "${{ matrix.package_name }}.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}
          path: ${{ matrix.package_name }}.zip
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine Release Tag
        id: release_info
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              TAG="v1.0.8"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release-artifacts/*.zip
          name: "KizCaption ${{ steps.release_info.outputs.tag }}"
          body: |
            ### 📦 Pilihan Download / Download Packages:
            - **`KizCaption-windows-x64-cuda.zip`** (Disarankan untuk GPU NVIDIA):
              - Akselerasi hardware real-time via NVIDIA CUDA 12 (RTX / GTX).
              - Sudah termasuk pustaka runtime CUDA (`cublas64_12.dll`, dll) untuk inferensi ultra cepat.
            - **`KizCaption-windows-x64-cpu.zip`** (Versi Ringan / CPU-Only):
              - Ukuran file jauh lebih kecil (~100 MB, hemat kuota).
              - Cocok untuk laptop standar atau PC tanpa GPU NVIDIA (menggunakan Intel Core / AMD Ryzen).
          generate_release_notes: true
          draft: false

